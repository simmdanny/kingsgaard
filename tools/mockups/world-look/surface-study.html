<title>Kingsgaard Surface Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@500;700&family=Alegreya+Sans:wght@400;500&display=swap">
<style>
/* layout: one full-screen 3D view, a small floating control card (top-left on wide screens, bottom sheet on phones) */
:root{
  --ink:#eef0e2;        /* text on the card */
  --ink-dim:#b9bfa6;    /* secondary text */
  --card:rgba(28,33,22,.84);
  --line:rgba(238,240,226,.16);
  --moss:#9bc24a;       /* active state, the meadow's own green */
  --ground:#1f251a;     /* page behind the canvas */
  --f-label:"Alegreya Sans SC","Trebuchet MS",sans-serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);overflow:hidden}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#view:active{cursor:grabbing}
#ui{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  width:min(300px,calc(100% - 32px));background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:14px 14px 12px;display:flex;flex-direction:column;gap:12px;backdrop-filter:blur(6px)}
.brand{font-family:var(--f-label);font-weight:700;font-size:17px;letter-spacing:.06em;line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-weight:400;letter-spacing:0;font-size:13px;color:var(--ink-dim);margin-top:4px}
.row{display:flex;flex-direction:column;gap:6px}
.lab{font-family:var(--f-label);font-size:12px;letter-spacing:.12em;color:var(--ink-dim)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-width:0;font:500 14px var(--f-body);color:var(--ink);background:transparent;border:1px solid var(--line);
  border-radius:6px;padding:6px 10px;cursor:pointer}
.seg button:hover{border-color:var(--ink-dim)}
.seg button.on{background:var(--moss);border-color:var(--moss);color:#18200f}
.seg button:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
.note{font-size:13px;line-height:1.4;color:var(--ink-dim);margin:0}
@media (max-width:620px){
  #ui{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));width:calc(100% - 32px);gap:9px;padding:11px 12px}
  .brand small,.note{display:none}
}
</style>

<canvas id="view" aria-label="3D view of a meadow with a dirt path, a rock cliff and boulders"></canvas>
<div id="ui">
  <div class="brand">Kingsgaard surface study<small>Tier 1–2 dirt path, painted cliff, boulders and meadow ground</small></div>
  <div class="row"><span class="lab">Look</span>
    <div class="seg" id="look"><button id="look-old" data-v="old">Current game</button><button id="look-new" data-v="new" class="on">New</button></div></div>
  <div class="row"><span class="lab">Cliff rock</span>
    <div class="seg" id="rock"><button id="rock-brown" data-v="brown" class="on">Brown</button><button id="rock-grey" data-v="grey">Grey</button></div></div>
  <div class="row"><span class="lab">View</span>
    <div class="seg" id="views"><button id="v-path" data-v="path" class="on">Path</button><button id="v-bank" data-v="bank">Cliff</button><button id="v-boulders" data-v="boulders">Boulders</button><button id="v-over" data-v="over">Overview</button><button id="v-row" data-v="row">Boulder row</button><button id="v-top" data-v="top">Path top-down</button></div></div>
  <p class="note">Drag to look around, scroll or pinch to zoom.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===================== noise (JS, for the shapes) ===================== */
function h2(i,j){let h=Math.imul(i|0,374761393)+Math.imul(j|0,668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function h3(i,j,k){return h2(i+Math.imul(k|0,1442695041),j-Math.imul(k|0,40503));}
function vn2(x,y){const i=Math.floor(x),j=Math.floor(y);let u=x-i,v=y-j;u=u*u*(3-2*u);v=v*v*(3-2*v);const a=h2(i,j),b=h2(i+1,j),c=h2(i,j+1),d=h2(i+1,j+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm2(x,y){let s=0,a=.5,f=1;for(let k=0;k<4;k++){s+=a*vn2(x*f+k*17.1,y*f-k*9.3);a*=.5;f*=2.03;}return s/.9375;}
function vq2(x,y){const i=Math.floor(x),j=Math.floor(y);let u=x-i,v=y-j;u=u*u*u*(u*(u*6-15)+10);v=v*v*v*(v*(v*6-15)+10);const a=h2(i,j),b=h2(i+1,j),c=h2(i,j+1),d=h2(i+1,j+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbq2(x,y){let s=0,a=.5,f=1;for(let k=0;k<4;k++){const r=.62+k*.9,c=Math.cos(r),sn=Math.sin(r);s+=a*vq2((x*c-y*sn)*f+k*17.1,(x*sn+y*c)*f-k*9.3);a*=.5;f*=2.03;}return s/.9375;}
function vn3(x,y,z){const i=Math.floor(x),j=Math.floor(y),k=Math.floor(z);let u=x-i,v=y-j,w=z-k;u=u*u*(3-2*u);v=v*v*(3-2*v);w=w*w*(3-2*w);
  const L=(a,b,t)=>a+(b-a)*t;return L(L(L(h3(i,j,k),h3(i+1,j,k),u),L(h3(i,j+1,k),h3(i+1,j+1,k),u),v),L(L(h3(i,j,k+1),h3(i+1,j,k+1),u),L(h3(i,j+1,k+1),h3(i+1,j+1,k+1),u),v),w);}
function fbm3(x,y,z){let s=0,a=.5,f=1;for(let k=0;k<3;k++){s+=a*vn3(x*f+k*5.3,y*f-k*2.1,z*f+k*7.7);a*=.5;f*=2.07;}return s/.875;}
const S=(e0,e1,x)=>{const t=Math.min(1,Math.max(0,(x-e0)/(e1-e0)));return t*t*(3-2*t);};
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646;};

/* ===================== the place ===================== */
/* a meadow; on the left a cliff (one continuous rock face, not blocks) with a grassy top that rises into a hill at the back; a narrow dirt
   path winds through, bending right towards the hill; boulders on the meadow */
const bankX=z=>-6.5-1.0*Math.sin(z*.12);
const PATH=[];for(let z=54;z>=-44;z-=1){let x=1.2*Math.sin(z*.075)+.7*Math.sin(z*.21+1);if(z<-14)x+=-(z+14)*.35;PATH.push([x,z]);}
function pathDist(x,z){let best=1e9;for(let i=0;i<PATH.length-1;i++){const a=PATH[i],b=PATH[i+1];if(z>Math.max(a[1],b[1])+3||z<Math.min(a[1],b[1])-3)continue;
  const dx=b[0]-a[0],dz=b[1]-a[1],t=Math.max(0,Math.min(1,((x-a[0])*dx+(z-a[1])*dz)/(dx*dx+dz*dz))),ex=x-a[0]-dx*t,ez=z-a[1]-dz*t,d=Math.hypot(ex,ez);if(d<best)best=d;}return best;}
/* the path mask: 1 on the path, 0 on the meadow, with a wide noisy band between. Width varies 0.6-1.4x along the spline; the edge is
   broken by two scales of noise. The same function decides the ground colour, the grass falloff and the prop keep-out. */
const PATH_SEED=3.7,PATH_HALF=.8;
function pathHalfAt(x,z){return PATH_HALF*(1+.4*(fbq2(x*.08+PATH_SEED,z*.08)-.5)*2);}
function pathMask(x,z){const d=pathDist(x,z),h=pathHalfAt(x,z),e=d-h+.34*h*(fbq2(x*.9+PATH_SEED*5,z*.9)-.5)*2+.14*h*(vq2(x*3.2,z*3.2+PATH_SEED)-.5)*2;
  return 1-S(-.45*h,.45*h,e);}/* (a 60%-of-half-width band: dirt and grass mix through noise) */
function Hbase(x,z){/* the meadow and the hill, without the cliff */
  let h=1.5*(fbq2(x/22,z/22)-.5);
  h+=13*S(-38,-78,z)+3*(fbq2(x/18,z/18)-.3)*S(-36,-62,z);
  h+=1.8*S(12,45,x);return h;}
/* the cliff: its foot line; a height that rises and falls, vanishing into the slope in places; a grassy soil slope that climbs the face to an
   uneven height (gl) over a run (wl); above that the exposed rock, leaning back and bulging */
const LEAN=.26,footX=z=>bankX(z)+1.8,footDX=z=>-.12*Math.cos(z*.12);
const cliffFade=z=>S(36,22,z)*S(-48,-40,z);
const plateauH=z=>Math.max(0,(4.8+1.6*(fbq2(z/13,3.7)-.42))*cliffFade(z));/* the top of the step: 0 where the cliff disappears */
const cliffH=z=>plateauH(z)+(.5*(vq2(z/2.2,8.1)-.5)+.25*(vq2(z/.9,2.3)-.5))*S(.3,1.5,plateauH(z));/* the rock's own top edge: broken */
const glF=z=>Math.min(.40,Math.max(0,(fbq2(z/9,9.2)-.38)*1.6));/* how far up the face the grass climbs (fraction) */
const gLev=z=>glF(z)*plateauH(z),gRun=z=>1.0+4.2*glF(z)+.6*vq2(z/3,4.4);
const bul=(z,y)=>.45*(fbm2(z*.18+11,y*.25+2)-.5)*2;
function H(x,z){const hp=plateauH(z),xf=footX(z),gl=gLev(z),wl=gRun(z);return Hbase(x,z)+gl*S(xf+.3,xf-wl,x)+(hp-gl)*S(xf-wl-.2,xf-wl-LEAN*(hp-gl)-1.3,x);}

/* ===================== renderer, light ===================== */
const canvas=document.getElementById('view');
const R=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
R.setPixelRatio(Math.min(2,window.devicePixelRatio||1));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xa9d0ee);scene.fog=new THREE.Fog(0xbcdaef,80,200);
const camera=new THREE.PerspectiveCamera(55,1,.1,500);
const SUN=new THREE.Vector3(30,40,12).normalize();
const sun=new THREE.DirectionalLight(0xfff0d6,.95);sun.position.copy(SUN).multiplyScalar(80);sun.target.position.set(0,0,-6);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-62,right:62,top:62,bottom:-62,near:1,far:220});sun.shadow.bias=-.0002;sun.shadow.normalBias=.16;
scene.add(sun,sun.target,new THREE.HemisphereLight(0xd8ecff,0x8a7a58,.62),new THREE.AmbientLight(0xffffff,.10));

/* ===================== shared GLSL ===================== */
const GLSL_NOISE=`
float h31(vec3 p){p=fract(p*0.3183099+vec3(0.71,0.113,0.419));p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vn(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.0-2.0*f);
  return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float s=0.0,a=0.5;for(int i=0;i<4;i++){s+=a*vn(p);p=p*2.03+vec3(1.7,9.2,3.1);a*=0.5;}return s/0.9375;}
float vn2(vec2 p){return vn(vec3(p,0.37));}
float fbm2(vec2 p){return fbm(vec3(p,0.37));}
/* a jittered dot per cell: x = chance, y = distance to its dot, z = a second random */
vec3 cell2(vec2 p){vec2 i=floor(p),f=fract(p);vec2 c=vec2(h31(vec3(i,2.1)),h31(vec3(i,5.7)))*0.7+0.15;return vec3(h31(vec3(i,1.3)),length(f-c),h31(vec3(i,9.9)));}
/* distance to the nearest edge between random cells: angular cracks and joints */
float vedge(vec3 p){vec3 i=floor(p),f=fract(p);float d1=8.0,d2=8.0;
  for(int z=-1;z<=1;z++)for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec3 g=vec3(float(x),float(y),float(z));vec3 r=g+vec3(h31(i+g),h31(i+g+17.3),h31(i+g+31.7))-f;float d=dot(r,r);
    if(d<d1){d2=d1;d1=d;}else if(d<d2)d2=d;}
  return sqrt(d2)-sqrt(d1);}
/* painted grass strokes: one short pointed stroke per cell, leaning with a slowly turning 'combed' direction; returns (light, dark) cover */
vec2 gStrokes(vec2 X,float sc,float ang,float seed){vec2 p=X*sc,i=floor(p);vec2 L=vec2(0.0);float aa=0.7*length(fwidth(p))+0.012;
  for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec2 c=i+vec2(float(x),float(y));
    float r1=h31(vec3(c,seed)),r2=h31(vec3(c,seed+1.7)),r3=h31(vec3(c,seed+3.1)),r4=h31(vec3(c,seed+5.3)),r5=h31(vec3(c,seed+8.9));
    float a=ang+(r3-0.5)*0.9;vec2 dd=p-c-vec2(r1,r2);vec2 l=vec2(dot(dd,vec2(cos(a),sin(a))),dot(dd,vec2(-sin(a),cos(a))));
    float u=l.x/(0.7+0.5*r4);float w=0.19*max(1.0-u*u,0.0)*(1.0-0.4*u);
    float m=(1.0-smoothstep(w-aa,w+aa,abs(l.y)))*step(abs(u),1.0);
    if(r5<0.58)L.x=max(L.x,m);else L.y=max(L.y,m);}
  return L;}
vec3 ramp4(float t,vec3 a,vec3 b,vec3 c,vec3 d){t=clamp(t,0.0,1.0);return t<0.3333?mix(a,b,t*3.0):t<0.6667?mix(b,c,(t-0.3333)*3.0):mix(c,d,(t-0.6667)*3.0);}
vec3 ramp5(float t,vec3 a,vec3 b,vec3 c,vec3 d,vec3 e){t=clamp(t,0.0,1.0)*4.0;return t<1.0?mix(a,b,t):t<2.0?mix(b,c,t-1.0):t<3.0?mix(c,d,t-2.0):mix(d,e,t-3.0);}
vec3 grassRamp(float t){return ramp5(t,vec3(0.11,0.24,0.07),vec3(0.21,0.39,0.09),vec3(0.34,0.54,0.12),vec3(0.49,0.66,0.16),vec3(0.65,0.75,0.25));}
/* the meadow's own pattern (shared by the ground and the grass painted over the cliff, so the two meet without a seam):
   broad patches, darker clover clumps, and two sizes of painted blade strokes, lighter yellow-green and darker blue-green */
float meadowT(vec2 X,float fd,out float clump){
  float big=fbm2(X*0.035),mid=fbm2(X*0.14+7.0);
  float t=0.55+0.34*(big-0.5)+0.30*(mid-0.5)+0.06*(vn2(X*1.6)-0.5)*fd;
  clump=smoothstep(0.58,0.74,vn2(X*0.75+20.0)+0.10*(vn2(X*3.0)-0.5))*(0.15+0.85*fd);t-=0.10*clump;
  return t;}
vec3 meadowStrokes(vec3 col,vec2 X,float fd){/* fd here: the near fade */
  float ang=0.5+1.6*(fbm2(X*0.04)-0.5);
  vec2 s1=gStrokes(X,2.6,ang,1.0)*fd,s2=gStrokes(X,6.5,ang+0.3,7.0)*fd*fd;
  col=mix(col,col*vec3(1.16,1.10,0.78)+vec3(0.035,0.035,0.0),max(s1.x*0.75,s2.x*0.6));
  col=mix(col,col*vec3(0.70,0.80,0.86),max(s1.y*0.6,s2.y*0.5));
  return col;}
`;
function patch(key,mat,vtxDecl,vtxBody,fragDecl,fragColor,uniforms,fragNormal,hook){
  mat.onBeforeCompile=sh=>{Object.assign(sh.uniforms,uniforms||{});
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vWP;varying vec3 vWN;'+vtxDecl)
      .replace('#include <begin_vertex>','#include <begin_vertex>\nvec4 _wp=vec4(transformed,1.0);vec3 _wn=objectNormal;\n#ifdef USE_INSTANCING\n_wp=instanceMatrix*_wp;_wn=mat3(instanceMatrix)*_wn;\n#endif\nvWP=(modelMatrix*_wp).xyz;vWN=normalize(mat3(modelMatrix)*_wn);'+vtxBody);
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vWP;varying vec3 vWN;'+GLSL_NOISE+fragDecl)
      .replace('#include <'+(hook||'map_fragment')+'>','#include <'+(hook||'map_fragment')+'>\n'+fragColor).replace('#include <normal_fragment_maps>','#include <normal_fragment_maps>\n'+(fragNormal||''));};
  mat.customProgramCacheKey=()=>key;/* (each look its own program: three.js would otherwise reuse the first one built from this same function) */
  mat.extensions={derivatives:true};return mat;}

/* ===================== ground: meadow + dirt path ===================== */
const U={uNew:{value:1},uHalf:{value:.8},uSun:{value:SUN.clone()}};
const groundMat=patch('ground',new THREE.MeshPhongMaterial({color:0xffffff,shininess:2,specular:0x000000}),
 'attribute float aCav;attribute float aPd;attribute float aOcc;attribute float aPm;varying float vCav;varying float vPd;varying float vOcc;varying float vPm;',
 'vCav=aCav;vPd=aPd;vOcc=aOcc;vPm=aPm;',
 'varying float vCav;varying float vPd;varying float vOcc;varying float vPm;uniform float uNew;uniform float uHalf;uniform vec3 uSun;',
 `{
  vec3 P=vWP;vec3 N=normalize(vWN);vec2 X=P.xz;vec3 col;
  float fd=1.0-smoothstep(28.0,80.0,length(P-cameraPosition));/* (fine detail fades with distance: no shimmer) */
  if(uNew<0.5){
    /* --- the current game's ground: broad smooth drifts of two greens, a lighter patch, a flat-coloured road --- */
    float b=fbm2(X*0.02),m=fbm2(X*0.09);
    col=mix(vec3(0.115,0.245,0.085),vec3(0.215,0.395,0.105),smoothstep(0.25,0.75,b));col=mix(col,vec3(0.39,0.545,0.14),smoothstep(0.55,0.9,m)*0.45);
    col=mix(col,vec3(0.47,0.37,0.25),1.0-smoothstep(uHalf-0.15,uHalf+0.35,vPd));
  }else{
    /* --- MEADOW: a painted green made of several shades, laid in strokes, changed by where it is --- */
    float slope=1.0-N.y;
    float clump;float t=meadowT(X,fd,clump);
    t+=0.20*clamp(-vCav*2.5,0.0,1.0)-0.34*clamp(vCav*2.5,0.0,1.0);/* crests lighter, hollows deeper */
    t-=0.50*smoothstep(0.18,0.6,slope);/* banks darker */
    t-=0.50*vOcc;/* at the foot of rocks and boulders */
    float sunF=clamp(dot(N,normalize(uSun)),0.0,1.0);t+=0.14*(sunF-0.65);/* faces to the sun warmer */
    col=grassRamp(t);col=meadowStrokes(col,X,1.0-smoothstep(14.0,42.0,length(P-cameraPosition)));
    float dry=smoothstep(0.6,0.8,fbm2(X*0.06+3.0))*(0.4+0.6*sunF)*(1.0-vOcc)*(1.0-smoothstep(0.1,0.4,slope));
    col=mix(col,col*vec3(1.12,1.05,0.68)+vec3(0.05,0.03,0.0),dry*0.55);/* sunny dry patches */
    col=mix(col,col*vec3(0.84,0.95,1.10),clamp(vOcc*1.4+max(vCav,0.0)*2.0+clump*0.5,0.0,1.0)*0.5);/* shade and clumps a little bluer */
    float bare=smoothstep(0.50,0.72,slope+0.28*(fbm2(X*0.3)-0.5));/* only very steep ground shows earth */
    vec3 earth=mix(vec3(0.36,0.25,0.16),vec3(0.50,0.36,0.23),fbm2(X*0.8));
    col=mix(col,earth,bare*0.7);
    vec3 cl=cell2(X*2.2);/* little flowers, only on gentle ground */
    float fl=step(0.968,cl.x)*(1.0-smoothstep(0.05,0.1,cl.y))*smoothstep(0.35,0.65,fbm2(X*0.14+7.0))*(1.0-smoothstep(0.1,0.3,slope))*fd*(1.0-vOcc);
    col=mix(col,cl.z<0.45?vec3(0.96,0.96,0.92):cl.z<0.75?vec3(0.95,0.66,0.78):vec3(0.98,0.86,0.33),fl);

    /* --- DIRT PATH (tier 1-2 roads): narrow, its edge ragged with grass tufts, lighter worn middle, darker damp edges, pebbles --- */
    /* the mask (vertex) plus fine per-pixel noise in the band: grass patches creep onto the path, dirt pokes into the grass; no line anywhere */
    float bandW=smoothstep(0.0,0.2,vPm)*smoothstep(1.0,0.8,vPm)*5.0;
    float m=vPm+(0.26*(fbm2(X*1.6+9.0)-0.5)+0.14*(vn2(X*5.5)-0.5)+0.08*(vn2(X*12.0)-0.5)*fd)*bandW;
    float inside=smoothstep(0.30,0.70,m);/* dirt wins gradually: the two mix through noise over the whole band */
    float dpatch=smoothstep(0.55,0.75,m)*smoothstep(0.45,0.65,fbm2(X*2.2+3.0));inside=max(inside,dpatch);/* dirt patches poking into the grass */

   const x=p.getX(i),z=p.getZ(i);let o=0;for(const q of solids){const dd=Math.hypot(x-q[0],z-q[1])-q[2];const R=q[3]?.9+q[2]*.5:2.6;if(dd<R){const v=(1-S(-.3,R,dd))*(q[3]?.9:.85);if(v>o)o=v;}}
   {const hp=plateauH(z),d=x-(footX(z)-gRun(z));if(hp>.3&&d>-.6&&d<2.2)o=Math.max(o,(1-S(0,2.0,d))*.40*S(.3,1.5,hp));}occ[i]=o;}
 g.setAttribute('aCav',new THREE.BufferAttribute(cav,1));g.setAttribute('aPd',new THREE.BufferAttribute(pd,1));g.setAttribute('aPm',new THREE.BufferAttribute(pm,1));g.setAttribute('aOcc',new THREE.BufferAttribute(occ,1));g.computeVertexNormals();
 const m=new THREE.Mesh(g,groundMat);m.receiveShadow=true;scene.add(m);}

/* ===================== 3D grass: tufts of blades on crossed cards, drawn by the shader (no texture) ===================== */
const grassMat=new THREE.ShaderMaterial({side:THREE.DoubleSide,fog:true,
  uniforms:THREE.UniformsUtils.merge([THREE.UniformsLib.fog,{uSun:{value:SUN.clone()}}]),
  vertexShader:`varying vec2 vUv;varying vec3 vC;varying float vSh;uniform vec3 uSun;
    #include <fog_pars_vertex>
    void main(){vUv=uv;vC=instanceColor;vec4 wp=modelMatrix*instanceMatrix*vec4(position,1.0);
      vec3 nrm=normalize(mat3(modelMatrix*instanceMatrix)*vec3(0.0,0.0,1.0));vSh=0.78+0.22*abs(dot(nrm,uSun));
      vec4 mvPosition=viewMatrix*wp;gl_Position=projectionMatrix*mvPosition;
      #include <fog_vertex>
    }`,
  fragmentShader:`varying vec2 vUv;varying vec3 vC;varying float vSh;
    #include <fog_pars_fragment>
    float hs(float x){return fract(sin(x)*4375.7);}
    void main(){float ty=-1.0;
      for(int i=0;i<11;i++){float fi=float(i);float r1=hs(vC.z*91.7+fi*13.1),r2=hs(vC.z*17.3+fi*7.7),r3=hs(vC.z*51.9+fi*3.3);
        float cx=(fi+0.5)/11.0+(r1-0.5)*0.10;float hg=0.55+0.45*r2;if(vUv.y>hg)continue;
        float y=vUv.y/hg;float x=cx+(r3-0.5)*0.4*y*y;float w=0.052*(1.0-y*0.8)*(0.8+0.5*r1);
        if(abs(vUv.x-x)<w)ty=max(ty,y);}
      if(ty<0.0)discard;
      vec3 col=mix(vec3(0.24,0.44,0.09),vec3(0.62,0.80,0.22),ty)*vC.y*vSh;
      col=mix(col,col*vec3(1.08,1.0,0.78),vC.x*0.4);
      gl_FragColor=vec4(col,1.0);
      #include <fog_fragment>
    }`});
const tuftGeo=(()=>{const a=new THREE.PlaneGeometry(1,1);a.translate(0,.5,0);const b=a.clone();b.rotateY(Math.PI/2);
  const g=new THREE.BufferGeometry(),pa=a.attributes.position.array,pb=b.attributes.position.array,ua=a.attributes.uv.array;
  g.setAttribute('position',new THREE.Float32BufferAttribute([...pa,...pb],3));g.setAttribute('uv',new THREE.Float32BufferAttribute([...ua,...ua],2));
  const ia=a.index.array;g.setIndex([...ia,...ia.map(i=>i+4)]);return g;})();
const tuftSpots=[];/* where tufts go: thick along the cliff foot, then the meadow (thinner with distance, none on the path) */
for(let z=-47;z<32;z+=.09){const hp=plateauH(z);if(hp<.4)continue;const xf=footX(z),wl=gRun(z);for(let k=0;k<6;k++){const d=-wl*rnd()*rnd()-.45+1.9*Math.pow(rnd(),1.5);tuftSpots.push([xf+d,z,1.5-.3*d]);}}
for(let i=0;i<90000;i++){const r=2+52*Math.sqrt(rnd()),a=rnd()*6.283,x=1.5+r*Math.cos(a),z=4+r*Math.sin(a);
  if(rnd()>1.2-r/50)continue;const pmk=pathMask(x,z);if(pmk>0.08){const keep=pmk<0.5?1-pmk*1.7:(pmk<0.85?0.07:0.02);if(rnd()>keep)continue;}const hp=plateauH(z),xf=footX(z),gl=gLev(z),wl=gRun(z);if(hp>.3&&x<xf-wl+.2&&x>xf-wl-LEAN*(hp-gl)-1.6)continue;tuftSpots.push([x,z,(.85+.4*rnd())*(1-.55*pmk)]);}
for(const [x,y,z] of cliffFine.geometry.userData.ledges)tuftSpots.push([x,z,.45+.3*rnd(),y-.04]);
BINST.flat().forEach(b=>{if(b.sc<.3)return;const k=5+Math.floor(b.sc*7);for(let j=0;j<k;j++){const a=rnd()*6.283,d=b.rw*(.85+.5*rnd());tuftSpots.push([b.x+Math.cos(a)*d,b.z+Math.sin(a)*d,.8+.3*rnd()]);}});/* tufts around every boulder's base, overlapping it *//* small tufts and leafy bits on the ledges */
const tufts=new THREE.InstancedMesh(tuftGeo,grassMat,tuftSpots.length);
{const M=new THREE.Matrix4(),Q=new THREE.Quaternion(),Pv=new THREE.Vector3(),Sv=new THREE.Vector3(),C=new THREE.Color();
 tuftSpots.forEach(([x,z,sc,yl],i)=>{const h=yl!==undefined?yl:H(x,z)-.03;Pv.set(x,h,z);Q.setFromAxisAngle(new THREE.Vector3(0,1,0),rnd()*6.283);
   const w=.40+.22*rnd();Sv.set(w*sc,(.16+.14*rnd())*sc,w*sc);M.compose(Pv,Q,Sv);tufts.setMatrixAt(i,M);C.setRGB(yl!==undefined?.1:rnd()*.6,(yl!==undefined?.7:.85)+.3*rnd(),rnd());tufts.setColorAt(i,C);});
 tufts.instanceMatrix.needsUpdate=true;tufts.instanceColor.needsUpdate=true;scene.add(tufts);}


/* ===================== camera: drag to orbit, wheel / pinch to zoom ===================== */
const cam={yaw:0,pitch:.2,dist:20,t:new THREE.Vector3()};let dirty=true;
function applyCam(){const cp=Math.cos(cam.pitch);camera.position.set(cam.t.x+Math.sin(cam.yaw)*cp*cam.dist,cam.t.y+Math.sin(cam.pitch)*cam.dist,cam.t.z+Math.cos(cam.yaw)*cp*cam.dist);
  const g=H(camera.position.x,camera.position.z)+.6;if(camera.position.y<g)camera.position.y=g;camera.lookAt(cam.t);dirty=true;}
function setView(pos,tgt){cam.t.set(...tgt);const d=new THREE.Vector3(...pos).sub(cam.t);cam.dist=d.length();cam.pitch=Math.asin(d.y/cam.dist);cam.yaw=Math.atan2(d.x,d.z);applyCam();}
const VIEWS={path:[[1.6,1.7,32],[-.6,1.2,8]],bank:[[1.2,2.0,9.0],[-5.4,2.4,-0.5]],boulders:[[3,2.2,15],[10,.6,3]],over:[[30,22,46],[-6,2,-8]],row:[[19.7,2.4,52.5],[19.7,.7,44]],top:[[0.5,16,14.01],[0.5,0,14]]};
const ptrs=new Map();let pinch0=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch0=Math.hypot(a[0]-b[0],a[1]-b[1]);}});
canvas.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const pr=ptrs.get(e.pointerId);
  if(ptrs.size===1){cam.yaw-=(e.clientX-pr[0])*.005;cam.pitch=Math.max(-.05,Math.min(1.45,cam.pitch+(e.clientY-pr[1])*.005));applyCam();}
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2){const[a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch0){cam.dist=Math.max(2,Math.min(160,cam.dist*pinch0/d));applyCam();}pinch0=d;}});
const up=e=>{ptrs.delete(e.pointerId);pinch0=0;};canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.dist=Math.max(2,Math.min(160,cam.dist*Math.exp(e.deltaY*.001)));applyCam();},{passive:false});

/* ===================== controls ===================== */
function seg(id,fn){const box=document.getElementById(id);box.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;box.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));fn(b.dataset.v);});}
function setLook(v){const nw=v==='new';U.uNew.value=nw?1:0;U.uHalf.value=nw?.8:1.5;cliffFine.visible=nw;cliffCoarse.visible=!nw;tufts.visible=nw;boulderMeshes.forEach(m=>m.material=nw?boulderNew:boulderOld);dirty=true;}
function setRock(v){setPal(cliffU,v==='grey'?'grey':'brown');setPal(boulderU,v==='grey'?'grey':'brown');dirty=true;}
seg('look',setLook);seg('rock',setRock);seg('views',v=>setView(...VIEWS[v]));

function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;R.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();dirty=true;}
window.addEventListener('resize',resize);resize();setView(...VIEWS.path);
(function loop(){if(dirty){R.render(scene,camera);dirty=false;}requestAnimationFrame(loop);})();
function mark(id,v){document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));}
window.SS={view:v=>{mark('views',v);setView(...VIEWS[v]);},look:v=>{mark('look',v);setLook(v);},rock:v=>{mark('rock',v);setRock(v);},render:()=>{R.render(scene,camera);},ready:true};
</script>
